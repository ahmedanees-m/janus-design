[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-design"
version = "0.1.0"
description = "Joint amino-acid and codon design for de novo proteins"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Anees Ahmed Mahaboob Ali", email = "ahmedaneesm@gmail.com" },
    { name = "Radhakrishnan Delhibabu", email = "rdelhibabu@vit.ac.in" },
    { name = "Everette Jacob Remington Nelson", email = "everette.nelson@vit.ac.in" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5,<0.16",
]

[project.scripts]
janus = "janus.cli:main"

[project.urls]
Source = "https://github.com/ahmedanees-m/janus-design"

[tool.hatch.build.targets.wheel]
packages = ["src/janus"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
